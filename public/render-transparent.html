<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>App Icon 1024x1024</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: transparent;
    }
    img {
      width: 1024px;
      height: 1024px;
      display: block;
    }
  </style>
</head>
<body>
  <img src="./app-icon-emblem.svg" alt="App Icon Transparent" />
</body>
</html>
